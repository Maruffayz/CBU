version: "3.9"

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myfin
      MYSQL_USER: myfin
      MYSQL_PASSWORD: myfin_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: ./project
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_NAME: myfin
      DB_USER: myfin
      DB_PW: myfin_pass
      DB_HOST: db
      DB_PORT: 3306
      PORT: 3001
      ENABLE_USER_SIGNUP: "true"
    ports:
      - "3001:3001"

  web:
    build:
      context: ./web
      args:
        VITE_MYFIN_BASE_API_URL: http://api:3001
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
